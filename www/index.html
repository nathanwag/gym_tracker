<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino</title>
<meta name="description" content="Registro de cargas e repeticoes com graficos de progressao e recordes.">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<header class="topbar">
  <button class="topbar__back" id="topbar-back" type="button" aria-label="Voltar" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 class="topbar__title" id="topbar-title">Treino</h1>
  <div class="topbar__actions" id="topbar-actions"></div>
</header>

<main class="view" id="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Navegacao principal">
  <a class="tabbar__item" href="#/" data-tab="treino">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8v8M17.5 8v8M3.5 10v4M20.5 10v4M6.5 12h11"/></svg>
    <span>Treino</span>
  </a>
  <a class="tabbar__item" href="#/historico" data-tab="historico">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/></svg>
    <span>Historico</span>
  </a>
  <a class="tabbar__item" href="#/exercicios" data-tab="exercicios">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l4-6 4 3 8-9"/><path d="M4 20.5h16.5"/></svg>
    <span>Exercicios</span>
  </a>
  <a class="tabbar__item" href="#/ajustes" data-tab="ajustes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/></svg>
    <span>Ajustes</span>
  </a>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-close-sheet></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-close-sheet aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
